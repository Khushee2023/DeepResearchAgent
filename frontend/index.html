<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Research Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <main>
    <h1>Deep Research Agent</h1>
    <p class="subtitle">Plan → parallel research → critic loop → cited report</p>

    <form id="query-form">
      <input id="query" type="text" placeholder="Ask a research question..." required />
      <button id="start-btn" type="submit">Research</button>
    </form>

    <section id="plan-card" class="card hidden">
      <h2>Review the plan</h2>
      <p class="hint">One sub-question per line. Edit, remove or add lines, then approve.</p>
      <textarea id="plan-text" rows="6"></textarea>
      <button id="approve-btn" type="button">Approve &amp; continue</button>
    </section>

    <section id="progress-card" class="card hidden">
      <h2>Progress</h2>
      <ul id="progress-list"></ul>
    </section>

    <section id="error-card" class="card error hidden"></section>

    <section id="report-card" class="card hidden">
      <div class="report-head">
        <h2>Report</h2>
        <button id="copy-btn" type="button" class="secondary">Copy markdown</button>
      </div>
      <article id="report"></article>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
